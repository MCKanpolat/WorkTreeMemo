name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore WorkTreeMemo.slnx
      - run: dotnet build WorkTreeMemo.slnx --no-restore --configuration Release
      - run: dotnet test tests/WorkTreeMemo.Core.Tests/WorkTreeMemo.Core.Tests.csproj --no-build --no-restore --configuration Release --collect:"XPlat Code Coverage" --results-directory artifacts/coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: artifacts/coverage/**/coverage.cobertura.xml
          if-no-files-found: error
